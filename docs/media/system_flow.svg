<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540"><rect width="1400" height="540" fill="#0b1623"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#39ddd4"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#eaf2fa} .box{fill:#183047;stroke:#658396;stroke-width:2}.arrow{stroke:#39ddd4;stroke-width:3;fill:none;marker-end:url(#a)}</style><text x="36" y="55" font-size="32">Our current robot pipeline</text><text x="36" y="90" font-size="20" fill="#a8bdcf">Camera-based location + auxiliary depth mapping + planning + wheel control</text><g class="box"><rect x="40" y="160" width="200" height="90" rx="12"/><rect x="300" y="160" width="200" height="90" rx="12"/><rect x="560" y="160" width="200" height="90" rx="12"/><rect x="300" y="350" width="200" height="90" rx="12"/><rect x="560" y="350" width="200" height="90" rx="12"/><rect x="820" y="350" width="200" height="90" rx="12"/><rect x="1080" y="350" width="280" height="90" rx="12"/></g><g font-size="23" text-anchor="middle"><text x="140" y="212">RGB camera</text><text x="400" y="200">Visual SLAM</text><text x="400" y="230" font-size="17">+ wheel information</text><text x="660" y="200">Location estimate</text><text x="660" y="230" font-size="17">position + heading</text><text x="400" y="388">Simulated depth</text><text x="400" y="418" font-size="17">extra sensor input</text><text x="660" y="388">Obstacle grid</text><text x="660" y="418" font-size="17">free / blocked / unknown</text><text x="920" y="388">Path planning</text><text x="920" y="418" font-size="17">A* route search</text><text x="1220" y="388">Wheel control</text><text x="1220" y="418" font-size="17">RL policy + stop logic</text></g><g class="arrow"><path d="M240 205H294"/><path d="M500 205H554"/><path d="M660 250V344"/><path d="M500 395H554"/><path d="M760 395H814"/><path d="M1020 395H1074"/><path d="M760 205H920V344"/></g><text x="36" y="502" font-size="20">This diagram shows the current setup. It is not a pure single-camera obstacle avoidance system.</text></svg>
